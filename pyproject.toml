# Tooling config only — the plugins themselves have no dependencies and are
# installed by copying pykrita/* into Krita's resource folder (see README).
[project]
name = "krita-agent"
version = "1.1.0"
description = "AI + agent tooling for Krita: multi-provider image docker, file bridge, headless .kra builder"
license = { text = "MIT" }
requires-python = ">=3.8"

[tool.ruff]
line-length = 120
# Krita 5.x bundles Python 3.8–3.10; keep plugin code compatible.
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
ignore = [
    "N802",   # Krita API overrides use camelCase (canvasChanged, createActions)
    "SIM108", # if/else blocks are clearer than long ternaries here
    "SIM105", # explicit try/except/pass reads clearer around Krita's flaky view APIs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE", "B017"]
"tools/kra_build.py" = ["N807"]   # kritarunner calls a function literally named __main__

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["grok_image", "krita_image_uploader", "kra_build", "kra_prepare", "krita_bridge", "conftest", "fake_krita"]
known-third-party = ["krita"]
